# HUSHLINE — Rust core package manifest

[package]
name = "hushline-rust-core"
version = "0.1.5"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Rust implementation of the Hushline command contract."
repository = "https://github.com/anulum/HushLine"

[[bin]]
name = "hushline"
path = "src/main.rs"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
