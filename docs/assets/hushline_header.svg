<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2f6fb3" stop-opacity="0.30"/>
      <stop offset="55%" stop-color="#2f6fb3" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#2f6fb3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hexFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161d2b"/>
      <stop offset="100%" stop-color="#0e131d"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1280" height="640" fill="#0b0f17"/>

  <!-- grid -->
  <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="640"/><line x1="160" y1="0" x2="160" y2="640"/>
    <line x1="240" y1="0" x2="240" y2="640"/><line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="400" y1="0" x2="400" y2="640"/><line x1="480" y1="0" x2="480" y2="640"/>
    <line x1="560" y1="0" x2="560" y2="640"/><line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="720" y1="0" x2="720" y2="640"/><line x1="800" y1="0" x2="800" y2="640"/>
    <line x1="880" y1="0" x2="880" y2="640"/><line x1="960" y1="0" x2="960" y2="640"/>
    <line x1="1040" y1="0" x2="1040" y2="640"/><line x1="1120" y1="0" x2="1120" y2="640"/>
    <line x1="1200" y1="0" x2="1200" y2="640"/>
    <line x1="0" y1="80" x2="1280" y2="80"/><line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/><line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="400" x2="1280" y2="400"/><line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="560" x2="1280" y2="560"/>
  </g>

  <!-- faint data dashes -->
  <g fill="#2f6fb3" fill-opacity="0.22">
    <rect x="120" y="64" width="22" height="4"/><rect x="1024" y="120" width="26" height="4"/>
    <rect x="560" y="96" width="16" height="4"/><rect x="980" y="560" width="20" height="4"/>
    <rect x="200" y="600" width="18" height="4"/><rect x="1140" y="300" width="14" height="4"/>
  </g>

  <!-- emblem glow + concentric rings -->
  <circle cx="940" cy="320" r="240" fill="url(#glow)"/>
  <g fill="none" stroke="#2f6fb3" stroke-opacity="0.18">
    <circle cx="940" cy="320" r="186"/>
    <circle cx="940" cy="320" r="220" stroke-opacity="0.10"/>
  </g>

  <!-- output streams: four cores, secrets muted to *** -->
  <g font-family="DejaVu Sans Mono, monospace">
    <!-- stream paths -->
    <g fill="none" stroke="#2a3a57" stroke-width="2">
      <path d="M268 140 C 430 140, 620 220, 806 300"/>
      <path d="M268 214 C 440 214, 640 250, 806 312"/>
      <path d="M268 470 C 460 470, 650 400, 806 332"/>
      <path d="M268 540 C 440 540, 650 420, 806 344"/>
    </g>

    <!-- core nodes -->
    <g>
      <circle cx="250" cy="140" r="20" fill="#161d2b" stroke="#3a4a66"/>
      <text x="250" y="145" fill="#9fb0c6" font-size="14" text-anchor="middle">GO</text>
      <circle cx="250" cy="214" r="20" fill="#161d2b" stroke="#3a4a66"/>
      <text x="250" y="219" fill="#9fb0c6" font-size="14" text-anchor="middle">RS</text>
      <circle cx="250" cy="470" r="20" fill="#161d2b" stroke="#3a4a66"/>
      <text x="250" y="475" fill="#9fb0c6" font-size="14" text-anchor="middle">PY</text>
      <circle cx="250" cy="540" r="20" fill="#161d2b" stroke="#3a4a66"/>
      <text x="250" y="545" fill="#9fb0c6" font-size="14" text-anchor="middle">JS</text>
    </g>

    <!-- redaction marks (secret -> ***) clear of the title -->
    <g font-size="16">
      <text x="612" y="150" fill="#54627a">sk-3fa9b2</text>
      <text x="700" y="150" fill="#5a6b86">&#8594;</text>
      <text x="724" y="150" fill="#e6edf3">***</text>
      <text x="640" y="556" fill="#54627a">AKIA7Q</text>
      <text x="712" y="556" fill="#5a6b86">&#8594;</text>
      <text x="736" y="556" fill="#e6edf3">***</text>
    </g>
  </g>

  <!-- hexagon emblem (pointy-top) -->
  <polygon points="940,180 1061,250 1061,390 940,460 819,390 819,250"
           fill="url(#hexFill)" stroke="#2f6fb3" stroke-opacity="0.85" stroke-width="2"/>
  <polygon points="940,180 1061,250 1061,390 940,460 819,390 819,250"
           fill="none" stroke="#2f6fb3" stroke-opacity="0.25" stroke-width="10"/>

  <!-- emblem mark: terminal prompt + muted output bar -->
  <g stroke="#c9d1d9" stroke-width="6" stroke-linecap="round" fill="none">
    <polyline points="892,292 912,308 892,324"/>
  </g>
  <rect x="922" y="302" width="56" height="10" rx="5" fill="#c9d1d9"/>
  <g>
    <rect x="892" y="346" width="34" height="12" rx="6" fill="#3a4a66"/>
    <rect x="934" y="346" width="54" height="12" rx="6" fill="#c9d1d9"/>
    <rect x="996" y="346" width="20" height="12" rx="6" fill="#3a4a66"/>
  </g>

  <!-- wordmark + taglines -->
  <text x="98" y="300" font-family="DejaVu Sans, sans-serif" font-weight="bold"
        font-size="98" fill="#e6edf3" letter-spacing="2">HUSHLINE</text>
  <text x="102" y="352" font-family="DejaVu Sans Mono, monospace"
        font-size="26" fill="#4a90d9" letter-spacing="3">LOCAL COMMAND-OUTPUT MUTING</text>
  <text x="102" y="398" font-family="DejaVu Sans Mono, monospace"
        font-size="17" fill="#3fb950" letter-spacing="2">v0.1.5 // GO &#183; RUST &#183; PYTHON &#183; NODE</text>
</svg>
