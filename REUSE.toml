version = 1

[[annotations]]
path = "**/*.go"
SPDX-FileCopyrightText = "2020-2026 Miroslav Šotek"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = "**/*.py"
SPDX-FileCopyrightText = "2020-2026 Miroslav Šotek"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = "**/*.rs"
SPDX-FileCopyrightText = "2020-2026 Miroslav Šotek"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = "**/*.ts"
SPDX-FileCopyrightText = "2020-2026 Miroslav Šotek"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = "**/*.sh"
SPDX-FileCopyrightText = "2020-2026 Miroslav Šotek"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = "**/*.md"
SPDX-FileCopyrightText = "2020-2026 Miroslav Šotek"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = "**/*.html"
SPDX-FileCopyrightText = "2020-2026 Miroslav Šotek"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = "**/*.yml"
SPDX-FileCopyrightText = "2020-2026 Miroslav Šotek"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = "**/*.toml"
SPDX-FileCopyrightText = "2020-2026 Miroslav Šotek"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# JSON cannot carry inline comments; package manifests and TS config
# embed their SPDX marker in an "_spdx_header" field or a leading
# comment block. REUSE does not parse those, so they are annotated here.
[[annotations]]
path = ["**/*.json", "**/tsconfig.json"]
SPDX-FileCopyrightText = "2020-2026 Miroslav Šotek"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Root config and metadata files without a natural inline-comment slot.
[[annotations]]
path = [
  ".gitignore",
  "CODEOWNERS",
  "go.mod",
  "CITATION.cff",
  "**/.keep",
]
SPDX-FileCopyrightText = "2020-2026 Miroslav Šotek"
SPDX-License-Identifier = "AGPL-3.0-or-later"
