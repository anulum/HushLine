# HUSHLINE — CI workflow

name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test-and-build:
    name: core-go
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: setup go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: go version
        run: go version
      - name: verify go tests exist
        run: bash tools/check_go_test_files.sh
      - name: go build
        run: go build -buildvcs=false ./...
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race -covermode=atomic -coverprofile=/tmp/hushline_coverage.out ./...
      - name: verify go coverage
        run: bash tools/check_go_coverage.sh /tmp/hushline_coverage.out 95.0
      - name: generate release evidence
        run: bash tools/build_go_release_evidence.sh ci
      - name: verify fmt
        run: |
          test -z "$(gofmt -s -l . | tee /tmp/gofmt.out && cat /tmp/gofmt.out)"

  core-python:
    name: core-python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cores/core-python
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: install tooling
        run: python -m pip install --upgrade pip build twine pytest pytest-cov
      - name: test with coverage gate
        run: python -m pytest
      - name: build distribution
        run: python -m build
      - name: verify wheel carries the package
        run: |
          python - <<'PY'
          import glob, zipfile, sys
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          modules = [n for n in names if n.startswith("hushline_core/") and n.endswith(".py")]
          if not modules:
              sys.exit("wheel does not contain the hushline_core package")
          print("wheel modules:", modules)
          PY
      - name: twine metadata check
        run: python -m twine check dist/*

  core-rust:
    name: core-rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cores/core-rust
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: setup rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test

  core-node:
    name: core-node
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cores/core-node
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: setup node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cores/core-node/package-lock.json
      - name: install
        run: npm ci
      - name: test
        run: npm test
