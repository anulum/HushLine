# HUSHLINE — CI workflow

name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test-and-build:
    name: core-go
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: setup go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: go version
        run: go version
      - name: verify go tests exist
        run: bash tools/check_go_test_files.sh
      - name: go build
        run: go build -buildvcs=false ./...
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race -covermode=atomic -coverprofile=/tmp/hushline_coverage.out ./...
      - name: verify go coverage
        run: bash tools/check_go_coverage.sh /tmp/hushline_coverage.out 95.0
      - name: generate release evidence
        run: bash tools/build_go_release_evidence.sh ci
      - name: verify fmt
        run: |
          test -z "$(gofmt -s -l . | tee /tmp/gofmt.out && cat /tmp/gofmt.out)"

  core-python:
    name: core-python
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cores/core-python
    steps:
      - name: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: setup python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: install tooling
        run: python -m pip install --disable-pip-version-check --require-hashes -r requirements/dev.txt
      - name: test with coverage gate
        run: python -m pytest --cov=hushline_core --cov-report=xml --cov-report=term-missing
      - name: upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: cores/core-python/coverage.xml
          flags: core-python
          fail_ci_if_error: false
      - name: build distribution
        run: python -m build
      - name: verify wheel carries the package
        run: |
          python - <<'PY'
          import glob, zipfile, sys
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          modules = [n for n in names if n.startswith("hushline_core/") and n.endswith(".py")]
          if not modules:
              sys.exit("wheel does not contain the hushline_core package")
          print("wheel modules:", modules)
          PY
      - name: twine metadata check
        run: python -m twine check dist/*

  core-rust:
    name: core-rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cores/core-rust
    steps:
      - name: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: setup rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        run: cargo test

  core-node:
    name: core-node
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cores/core-node
    steps:
      - name: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: setup node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cores/core-node/package-lock.json
      - name: install
        run: npm ci
      - name: test
        run: npm test

  lock-audit:
    # Every committed dependency lock is audited against its advisory database
    # at every head. A finding fails the job; there is no severity threshold.
    # cores/core-python/tests/test_lock_audit_policy.py pins these commands.
    name: lock-audit
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: setup node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - name: setup python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: install cargo-audit
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-audit
      - name: install pip-audit
        run: python -m pip install --disable-pip-version-check --require-hashes -r cores/core-python/requirements/audit.txt
      - name: audit the Node lock
        run: npm audit --package-lock-only --prefix cores/core-node
      - name: audit the Python audit-tool lock
        run: python -m pip_audit --strict --require-hashes --disable-pip --progress-spinner=off -r cores/core-python/requirements/audit.txt
      - name: audit the Python tooling lock
        run: python -m pip_audit --strict --require-hashes --disable-pip --progress-spinner=off -r cores/core-python/requirements/dev.txt
      - name: audit the Rust lock
        run: cargo audit --deny warnings --file cores/core-rust/Cargo.lock
      - name: control locks with a published advisory fail the audit
        run: bash tools/check_lock_audit_controls.sh
